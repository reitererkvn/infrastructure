---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Upgrade system packages (manual only via --tags system_upgrade)
  ansible.builtin.apt:
    upgrade: dist
  tags: [ system_upgrade, never ]

- name: Install essential base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - vim
      - btop
      - tmux
      - jq
      - sqlite3
      - zstd
      - btrfs-progs
      - hdparm
      - rclone
      - restic
      - inotify-tools
      - rsync
      - sudo
      - fail2ban
      - zsh
      - fzf
      - zoxide
      - zsh-autosuggestions
      - zsh-syntax-highlighting
    state: present

- name: Ensure fail2ban service is running and enabled
  ansible.builtin.systemd:
    name: fail2ban
    enabled: yes
    state: started

- name: Configure DNS resolution (resolv.conf)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      domain fritz.box
      search fritz.box
      nameserver 192.168.178.1
    mode: '0644'
    owner: root
    group: root

- name: Configure systemd-networkd to ignore Docker veth interfaces
  ansible.builtin.copy:
    dest: /etc/systemd/network/wired.network
    content: |
      [Match]
      Name=en*
      Type=ether
      
      [Network]
      DHCP=yes
    mode: '0644'
    owner: root
    group: root
  notify: Restart systemd-networkd

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker official repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_distribution_release | default('trixie') }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

- name: Install Docker and Docker Compose
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is running and enabled
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    state: started

- name: Change kevin default shell to zsh
  ansible.builtin.user:
    name: kevin
    shell: /usr/bin/zsh

- name: Deploy .zshrc
  ansible.builtin.template:
    src: zshrc.j2
    dest: /home/kevin/.zshrc
    owner: kevin
    group: kevin
    mode: '0644'
- name: Add NVIDIA Container Toolkit GPG key
  ansible.builtin.get_url:
    url: https://nvidia.github.io/libnvidia-container/gpgkey
    dest: /usr/share/keyrings/nvidia-container-toolkit-keyring.asc
    mode: '0644'

- name: Add NVIDIA Container Toolkit repository
  ansible.builtin.deb822_repository:
    name: nvidia-container-toolkit
    types: [deb]
    uris: "https://nvidia.github.io/libnvidia-container/stable/deb/amd64"
    suites: ["/"]
    signed_by: /usr/share/keyrings/nvidia-container-toolkit-keyring.asc
    state: present

- name: Install NVIDIA and CUDA dependencies
  ansible.builtin.apt:
    name:
      - nvidia-container-toolkit
      - libcuda1
    state: present
    update_cache: yes

- name: Configure Docker to use NVIDIA runtime with CDI as default
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
          "default-runtime": "nvidia",
          "features": {
              "cdi": true
          },
          "runtimes": {
              "nvidia": {
                  "args": [],
                  "path": "nvidia-container-runtime"
              }
          }
      }
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker

- name: Configure NVIDIA Container Runtime to use CDI mode (prevents systemd daemon-reload cgroup device loss)
  ansible.builtin.lineinfile:
    path: /etc/nvidia-container-runtime/config.toml
    regexp: '^#?\s*mode\s*='
    insertafter: '^\[nvidia-container-runtime\]'
    line: 'mode = "cdi"'
    owner: root
    group: root
    mode: '0644'

- name: Generate NVIDIA CDI specification
  ansible.builtin.command: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
  args:
    creates: /etc/cdi/nvidia.yaml

- name: Ensure rclone config directory exists
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    mode: '0700'

- name: Deploy rclone config from vault
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    mode: '0600'

- name: Configure native HDD spindown in /etc/hdparm.conf
  ansible.builtin.copy:
    dest: /etc/hdparm.conf
    content: |
      # Managed by Ansible (nas_base)
      # Native ATA standby timer (240 = 20 minutes) for SATA HDDs
      # Uses force_spindown_time to bypass Debian APM check (#758988) on WD Red CMR drives
      quiet
      force_spindown_time = 240

      /dev/disk/by-label/HDD-01 {
          force_spindown_time = 240
      }
    owner: root
    group: root
    mode: '0644'
  notify: Apply hdparm settings
