---
- name: Ensure mount points exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/HDD-01
    - /mnt/HDD-01/backups
    - /mnt/HDD-01/immich
    - /mnt/HDD-01/immich/.snapshots
    - /mnt/HDD-01/paperless
    - /mnt/HDD-01/paperless/.snapshots
    - /opt/docker/immich
    - /.snapshots
    - /home/.snapshots
    - /opt/docker/immich/.snapshots
    - /lib/immich

# SSD Mounts (assuming the base installation mounted / and created rootfs)
- name: Mount SSD Subvolumes
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "LABEL=NAS-SSD"
    fstype: btrfs
    opts: "subvol={{ item.subvol }},compress=zstd,ssd"
    state: mounted
  loop:
    - { path: '/opt/docker/immich', subvol: '@immich' }
    - { path: '/.snapshots', subvol: '@snapshots' }
    - { path: '/home/.snapshots', subvol: '@home_snapshots' }
    - { path: '/opt/docker/immich/.snapshots', subvol: '@immich_snapshots' }

# HDD Mounts & Creation
- name: Mount HDD root
  ansible.posix.mount:
    path: /mnt/HDD-01
    src: LABEL=HDD-01
    fstype: btrfs
    opts: subvol=/,noatime,compress=zstd
    state: mounted

- name: Ensure HDD subvolumes exist
  ansible.builtin.command: btrfs subvolume create /mnt/HDD-01/{{ item }}
  args:
    creates: /mnt/HDD-01/{{ item }}
  loop:
    - backups
    - immich
    - immich_snapshots
    - paperless
    - paperless_snapshots

- name: Mount HDD Subvolumes
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: LABEL=HDD-01
    fstype: btrfs
    opts: "subvol=/{{ item.subvol }},noatime,compress=zstd"
    state: mounted
  loop:
    - { path: '/mnt/HDD-01/backups', subvol: 'backups' }
    - { path: '/mnt/HDD-01/immich', subvol: 'immich' }
    - { path: '/mnt/HDD-01/immich/.snapshots', subvol: 'immich_snapshots' }
    - { path: '/mnt/HDD-01/paperless', subvol: 'paperless' }
    - { path: '/mnt/HDD-01/paperless/.snapshots', subvol: 'paperless_snapshots' }

# MergerFS Mount
- name: Install mergerfs package
  ansible.builtin.apt:
    name: mergerfs
    state: present

- name: Mount MergerFS for Immich
  ansible.posix.mount:
    path: /lib/immich
    src: /opt/docker/immich/data:/mnt/HDD-01/immich
    fstype: mergerfs
    opts: defaults,allow_other,cache.files=off,use_ino,category.create=ff,minfreespace=20G,fsname=mergerfs_immich
    state: mounted

# Snapper Configuration
- name: Ensure snapper is installed
  ansible.builtin.apt:
    name: snapper
    state: present

- name: Remove legacy broken snapper config (immich_data)
  ansible.builtin.file:
    path: /etc/snapper/configs/immich_data
    state: absent

- name: Deploy snapper configurations (SSD and HDD)
  ansible.builtin.template:
    src: snapper.j2
    dest: /etc/snapper/configs/{{ item.name }}
    owner: root
    group: root
    mode: '0640'
  loop:
    - { name: 'root', subvol_path: '/', timeline_create: 'yes', bg_compare: 'yes' }
    - { name: 'home', subvol_path: '/home', timeline_create: 'yes', bg_compare: 'yes' }
    - { name: 'immich', subvol_path: '/opt/docker/immich', timeline_create: 'yes', bg_compare: 'yes' }
    - { name: 'immich-hdd', subvol_path: '/mnt/HDD-01/immich', timeline_create: 'no', bg_compare: 'no' }
    - { name: 'paperless-hdd', subvol_path: '/mnt/HDD-01/paperless', timeline_create: 'no', bg_compare: 'no' }

- name: Register active snapper configs in /etc/default/snapper
  ansible.builtin.lineinfile:
    path: /etc/default/snapper
    regexp: '^SNAPPER_CONFIGS='
    line: 'SNAPPER_CONFIGS="root home immich immich-hdd paperless-hdd"'
    create: yes
    owner: root
    group: root
    mode: '0644'

- name: Ensure snapper timers are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - snapper-timeline.timer
    - snapper-cleanup.timer
