---
# handlers file for nas_base

- name: Restart Docker
  ansible.builtin.systemd:
    name: docker
    state: restarted

- name: Restart systemd-networkd
  ansible.builtin.systemd:
    name: systemd-networkd
    state: restarted

- name: Apply hdparm settings
  ansible.builtin.command: /usr/lib/pm-utils/power.d/95hdparm-apm resume
  changed_when: true
