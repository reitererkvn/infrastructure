---
- name: Check existing BTRFS subvolumes on NAS-SSD
  ansible.builtin.command: btrfs subvolume list -t /
  register: nas_ssd_subvolumes
  changed_when: false

- name: Determine missing SSD subvolumes
  ansible.builtin.set_fact:
    nas_ssd_missing_subvols: >-
      {{
        ['@immich', '@snapshots', '@home_snapshots', '@immich_snapshots']
        | reject('in', nas_ssd_subvolumes.stdout_lines | map('regex_replace', '^.*\t', '') | list)
        | list
      }}

- name: Ensure temporary SSD root mountpoint exists when creating missing SSD subvolumes
  ansible.builtin.file:
    path: /mnt/nas-ssd-root
    state: directory
    mode: '0755'
  when: nas_ssd_missing_subvols | length > 0

- name: Temporarily mount NAS-SSD top-level root to create missing subvolumes
  ansible.posix.mount:
    path: /mnt/nas-ssd-root
    src: "LABEL=NAS-SSD"
    fstype: btrfs
    opts: subvol=/
    state: ephemeral
  when: nas_ssd_missing_subvols | length > 0

- name: Create missing SSD subvolumes
  ansible.builtin.command: "btrfs subvolume create /mnt/nas-ssd-root/{{ item }}"
  args:
    creates: "/mnt/nas-ssd-root/{{ item }}"
  loop: "{{ nas_ssd_missing_subvols }}"
  when: nas_ssd_missing_subvols | length > 0

- name: Unmount temporary NAS-SSD root
  ansible.posix.mount:
    path: /mnt/nas-ssd-root
    state: unmounted
  when: nas_ssd_missing_subvols | length > 0

- name: Remove temporary SSD root mountpoint
  ansible.builtin.file:
    path: /mnt/nas-ssd-root
    state: absent

- name: Ensure top-level mount points and trigger directory exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/HDD-01
    - /opt/docker/immich
    - /.snapshots
    - /home/.snapshots
    - /lib/immich
    - /var/lib/nas-sync-triggers

# SSD Mounts
- name: Mount primary SSD Subvolumes
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: "LABEL=NAS-SSD"
    fstype: btrfs
    opts: "subvol={{ item.subvol }},compress=zstd,ssd"
    state: mounted
  loop:
    - { path: '/opt/docker/immich', subvol: '@immich' }
    - { path: '/.snapshots', subvol: '@snapshots' }
    - { path: '/home/.snapshots', subvol: '@home_snapshots' }

- name: Ensure Immich SSD data branch and snapshot mountpoint exist inside @immich
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/docker/immich/data
    - /opt/docker/immich/.snapshots

- name: Mount Immich SSD snapshots subvolume
  ansible.posix.mount:
    path: /opt/docker/immich/.snapshots
    src: "LABEL=NAS-SSD"
    fstype: btrfs
    opts: "subvol=@immich_snapshots,compress=zstd,ssd"
    state: mounted

# HDD Mounts & Creation
- name: Mount HDD root
  ansible.posix.mount:
    path: /mnt/HDD-01
    src: LABEL=HDD-01
    fstype: btrfs
    opts: subvol=/,noatime,compress=zstd
    state: mounted

- name: Ensure HDD subvolumes exist
  ansible.builtin.command: btrfs subvolume create /mnt/HDD-01/{{ item }}
  args:
    creates: /mnt/HDD-01/{{ item }}
  loop:
    - backups
    - immich
    - immich_snapshots
    - paperless
    - paperless_snapshots

- name: Ensure primary HDD subvolume mount points exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/HDD-01/backups
    - /mnt/HDD-01/immich
    - /mnt/HDD-01/paperless

- name: Mount primary HDD Subvolumes
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: LABEL=HDD-01
    fstype: btrfs
    opts: "subvol=/{{ item.subvol }},noatime,compress=zstd"
    state: mounted
  loop:
    - { path: '/mnt/HDD-01/backups', subvol: 'backups' }
    - { path: '/mnt/HDD-01/immich', subvol: 'immich' }
    - { path: '/mnt/HDD-01/paperless', subvol: 'paperless' }

- name: Ensure HDD snapshot mount points exist inside mounted subvolumes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/HDD-01/immich/.snapshots
    - /mnt/HDD-01/paperless/.snapshots

- name: Mount HDD snapshot subvolumes
  ansible.posix.mount:
    path: "{{ item.path }}"
    src: LABEL=HDD-01
    fstype: btrfs
    opts: "subvol=/{{ item.subvol }},noatime,compress=zstd"
    state: mounted
  loop:
    - { path: '/mnt/HDD-01/immich/.snapshots', subvol: 'immich_snapshots' }
    - { path: '/mnt/HDD-01/paperless/.snapshots', subvol: 'paperless_snapshots' }

# MergerFS Mount
- name: Install mergerfs package
  ansible.builtin.apt:
    name: mergerfs
    state: present

- name: Mount MergerFS for Immich
  ansible.posix.mount:
    path: /lib/immich
    src: /opt/docker/immich/data:/mnt/HDD-01/immich
    fstype: mergerfs
    opts: defaults,allow_other,cache.files=off,use_ino,category.create=ff,minfreespace=20G,fsname=mergerfs_immich
    state: mounted

# Snapper Configuration
- name: Ensure snapper is installed
  ansible.builtin.apt:
    name: snapper
    state: present

- name: Remove legacy broken snapper config (immich_data)
  ansible.builtin.file:
    path: /etc/snapper/configs/immich_data
    state: absent

- name: Deploy snapper configurations (SSD and HDD)
  ansible.builtin.template:
    src: snapper.j2
    dest: /etc/snapper/configs/{{ item.name }}
    owner: root
    group: root
    mode: '0640'
  loop:
    - { name: 'root', subvol_path: '/', timeline_create: 'yes', bg_compare: 'yes' }
    - { name: 'home', subvol_path: '/home', timeline_create: 'yes', bg_compare: 'yes' }
    - { name: 'immich', subvol_path: '/opt/docker/immich', timeline_create: 'yes', bg_compare: 'yes' }
    - { name: 'immich-hdd', subvol_path: '/mnt/HDD-01/immich', timeline_create: 'no', bg_compare: 'no' }
    - { name: 'paperless-hdd', subvol_path: '/mnt/HDD-01/paperless', timeline_create: 'no', bg_compare: 'no' }

- name: Register active snapper configs in /etc/default/snapper
  ansible.builtin.lineinfile:
    path: /etc/default/snapper
    regexp: '^SNAPPER_CONFIGS='
    line: 'SNAPPER_CONFIGS="root home immich immich-hdd paperless-hdd"'
    create: yes
    owner: root
    group: root
    mode: '0644'

- name: Ensure snapper timers are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - snapper-timeline.timer
    - snapper-cleanup.timer
