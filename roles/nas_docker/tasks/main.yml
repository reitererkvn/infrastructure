---
- name: Ensure base configuration directory exists
  become: true
  ansible.builtin.file:
    path: /opt/docker
    state: directory
    mode: '2775'
    owner: root
    group: root
    recurse: false
- name: Enable IPv6 Route Information Option (RIO) for Matter/Thread Border Routers
  become: true
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '64'
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-ipv6-matter.conf
  loop:
    - net.ipv6.conf.all.accept_ra_rt_info_max_plen
    - net.ipv6.conf.default.accept_ra_rt_info_max_plen
    - "net.ipv6.conf.{{ ansible_default_ipv4.interface }}.accept_ra_rt_info_max_plen"
  when: "'homeassistant' in (docker_apps_services | default([]))"
- name: Enable nonlocal IPv4 bind for Tailscale-bound Caddy ports
  become: true
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-nonlocal-bind.conf
  when: "'caddy' in (docker_apps_services | default([]))"
- name: Ensure proxy_net network exists
  become: true
  community.docker.docker_network:
    name: proxy_net
    state: present
    driver: bridge
    ipam_config:
      - subnet: 172.30.0.0/16
        gateway: 172.30.0.1
  tags: [ docker_apps ]
- name: Ensure service directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    recurse: "{{ item.recurse | default(false) }}"
  loop:
    - { path: /opt/docker/semaphore, service: 'semaphore' }
    - { path: /opt/docker/semaphore/db, owner: '70', group: '70', recurse: true, service: 'semaphore' }
    - { path: /opt/docker/semaphore/playbooks, service: 'semaphore' }
    - { path: /opt/docker/homeassistant, service: 'homeassistant' }
    - { path: /opt/docker/homeassistant/config, service: 'homeassistant' }
    - { path: /opt/docker/homeassistant/matter, owner: '1000', group: '1000', recurse: true, service: 'homeassistant' }
    - { path: /opt/docker/prometheus, service: 'prometheus' }
    - { path: /opt/docker/prometheus/config, service: 'prometheus' }
    - { path: /opt/docker/prometheus/data, owner: '65534', recurse: true, service: 'prometheus' }
    - { path: /opt/docker/grafana, service: 'grafana' }
    - { path: /opt/docker/grafana/data, owner: '472', group: '472', recurse: true, service: 'grafana' }
    - { path: /opt/docker/grafana/provisioning, service: 'grafana' }
    - { path: /opt/docker/grafana/provisioning/datasources, service: 'grafana' }
    - { path: /opt/docker/grafana/provisioning/dashboards, service: 'grafana' }
    - { path: /opt/docker/grafana/provisioning/dashboards/definitions, service: 'grafana' }
    - { path: /opt/docker/caddy, service: 'caddy' }
    - { path: /opt/docker/caddy/data, service: 'caddy' }
    - { path: /opt/docker/caddy/config, service: 'caddy' }
    - { path: /opt/docker/vaultwarden, service: 'vaultwarden' }
    - { path: /opt/docker/vaultwarden/data, service: 'vaultwarden' }
    - { path: /opt/docker/immich, group: "root", service: 'immich' }
    - { path: /opt/docker/immich/model-cache, group: "root", service: 'immich' }
    - { path: /opt/docker/cloudflared, service: 'cloudflared' }
    - { path: /opt/docker/adguard, service: 'adguard' }
    - { path: /opt/docker/adguard/work, service: 'adguard' }
    - { path: /opt/docker/adguard/conf, service: 'adguard' }
    - { path: /opt/docker/paperless, service: 'paperless' }
    - { path: /opt/docker/paperless/data, service: 'paperless' }
    - { path: /opt/docker/paperless/db, service: 'paperless' }
    - { path: /opt/docker/paperless/consume, service: 'paperless' }
    - { path: /mnt/HDD-01/paperless/media, service: 'paperless' }
    - { path: /opt/docker/ollama, service: 'ollama' }
    - { path: /opt/docker/ollama/data, service: 'ollama' }
  when: "item.service in (docker_apps_services | default([]))"
- name: Deploy Prometheus configuration
  become: true
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/docker/prometheus/config/prometheus.yml
    mode: '0644'
    owner: root
    group: root
  when: "'prometheus' in (docker_apps_services | default([]))"
- name: Deploy Grafana provisioning configuration
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: '0644'
    owner: root
    group: root
  loop:
    - { src: grafana_datasource_prometheus.yml.j2, dest: /opt/docker/grafana/provisioning/datasources/prometheus.yml }
    - { src: grafana_dashboards_provider.yml.j2, dest: /opt/docker/grafana/provisioning/dashboards/dashboards.yml }
  when: "'grafana' in (docker_apps_services | default([]))"
- name: Deploy Docker Compose files
  become: true
  ansible.builtin.template:
    src: "compose/{{ item }}.yml.j2"
    dest: "/opt/docker/{{ item }}/docker-compose.yml"
    mode: '0644'
    owner: root
    group: root
  loop: "{{ docker_apps_services | default([]) }}"
  vars:
    current_service: "{{ item }}"
- name: Deploy Environment variables (.env)
  become: true
  ansible.builtin.template:
    src: "{{ item }}.env.j2"
    dest: "/opt/docker/{{ item }}/.env"
    mode: '0600'
    owner: root
    group: root
  loop:
    - paperless
    - immich
    - grafana
    - caddy
    - cloudflared
    - semaphore
    - vaultwarden
  when: "item in (docker_apps_services | default([]))"
- name: Deploy Caddy Dockerfile
  become: true
  ansible.builtin.template:
    src: caddy_Dockerfile.j2
    dest: /opt/docker/caddy/Dockerfile
    mode: '0644'
    owner: root
    group: root
  when: "'caddy' in (docker_apps_services | default([]))"
- name: Gather local SSH host public keys for Semaphore known_hosts
  become: true
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - /etc/ssh/ssh_host_ed25519_key.pub
    - /etc/ssh/ssh_host_ecdsa_key.pub
  register: nas_ssh_host_pubkeys
  when: "'semaphore' in (docker_apps_services | default([]))"
- name: Deploy Semaphore ssh_known_hosts
  become: true
  ansible.builtin.copy:
    dest: /opt/docker/semaphore/ssh_known_hosts
    content: |
      {% for key_res in nas_ssh_host_pubkeys.results | default([]) if key_res.content is defined %}
      nas-01,192.168.178.46,127.0.0.1 {{ (key_res.content | b64decode).strip().split(' ')[0:2] | join(' ') }}
      {% endfor %}
    mode: '0644'
    owner: root
    group: root
  when: "'semaphore' in (docker_apps_services | default([]))"
- name: Deploy Caddyfile configuration
  become: true
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/docker/caddy/Caddyfile
    mode: '0644'
    owner: root
    group: root
    unsafe_writes: true
  register: caddyfile_status
  when: "'caddy' in (docker_apps_services | default([]))"
- name: Check Caddy container status before reload
  become: true
  ansible.builtin.command: docker ps -q -f name=^/caddy$
  register: caddy_running
  changed_when: false
  when: "'caddy' in (docker_apps_services | default([])) and caddyfile_status.changed"
- name: Reload Caddy to apply changes
  become: true
  ansible.builtin.command:
    cmd: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
  when: "'caddy' in (docker_apps_services | default([])) and caddyfile_status.changed and (caddy_running.stdout | default('') != '')"
- name: Check Semaphore container status
  become: true
  ansible.builtin.command: docker ps -q -f name=semaphore
  register: semaphore_running
  changed_when: false
  when: "'semaphore' in (docker_apps_services | default([]))"
  tags: [ docker_apps ]
- name: Start Semaphore safely
  become: true
  community.docker.docker_compose_v2:
    project_src: "/opt/docker/semaphore/"
    state: present
    pull: "{{ 'always' if 'pull_images' in ansible_run_tags else 'missing' }}"
    wait: true
  when: >
    'semaphore' in (docker_apps_services | default([]))
    and semaphore_running.stdout | default('') == ''
    and 'infrastructure_only' not in ansible_run_tags
  tags: [ docker_apps ]
- name: Restart Docker Compose Stacks
  become: true
  community.docker.docker_compose_v2:
    project_src: "/opt/docker/{{ item }}/"
    state: present
    pull: "{{ 'always' if 'pull_images' in ansible_run_tags else 'missing' }}"
    wait: true
  loop: "{{ docker_apps_services | default([]) }}"
  vars:
    current_service: "{{ item }}"
  when: "item != 'semaphore' or 'infrastructure_only' in ansible_run_tags"
  tags: [ infrastructure_only, docker_apps ]
