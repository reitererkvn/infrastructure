---
- name: Deploy Pacman configuration
  ansible.builtin.copy:
    src: etc/pacman.conf
    dest: /etc/pacman.conf
    owner: root
    group: root
    mode: '0644'

- name: Deploy Makepkg configuration
  ansible.builtin.copy:
    src: etc/makepkg.conf
    dest: /etc/makepkg.conf
    owner: root
    group: root
    mode: '0644'

- name: Deploy CPU Power config
  ansible.builtin.copy:
    src: etc/cpupower
    dest: /etc/default/cpupower
    owner: root
    group: root
    mode: '0644'
  ignore_errors: yes

- name: Deploy Greetd Config
  ansible.builtin.copy:
    src: etc/greetd/config.toml
    dest: /etc/greetd/config.toml
    owner: root
    group: root
    mode: '0644'

- name: Deploy Udev Rules
  ansible.builtin.copy:
    src: etc/udev/rules.d/99-g903-reset.rules
    dest: /etc/udev/rules.d/99-g903-reset.rules
    owner: root
    group: root
    mode: '0644'
  notify: Reload Udev

- name: Deploy Local Scripts
  ansible.builtin.copy:
    src: "usr/local/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop:
    - btrfs-cleanup
    - hyprsysteminfo
    - system-update.sh
    - g903-reset.sh
    - upload_snapshots.sh
    - pam-bw-unlock.sh

- name: Deploy Systemd Services and Timers
  ansible.builtin.copy:
    src: "etc/systemd/system/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - snapshot-backup.timer
    - snapshot-backup.service
    - backup-on-shutdown.service
    - rclone-localmount@.service
  notify: Reload Systemd

- name: Disable legacy headless system-update timer
  ansible.builtin.systemd:
    name: system-update.timer
    enabled: no
    state: stopped
  failed_when: false

- name: Remove legacy headless system-update unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop:
    - system-update.timer
    - system-update.service
  notify: Reload Systemd

- name: Ensure prometheus-node-exporter is installed
  community.general.pacman:
    name: prometheus-node-exporter
    state: present

- name: Enable System Timers and Services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - snapshot-backup.timer
    - backup-on-shutdown.service
    - prometheus-node-exporter.service

- name: Check whether firewalld is active
  ansible.builtin.command: systemctl is-active --quiet firewalld
  register: desktop_firewalld_status
  changed_when: false
  failed_when: false

- name: Allow Prometheus scraping of node_exporter from nas-01
  ansible.posix.firewalld:
    zone: public
    rich_rule: 'rule family="ipv4" source address="192.168.178.46/32" port port="9100" protocol="tcp" accept'
    permanent: true
    immediate: true
    state: enabled
  when: desktop_firewalld_status.rc == 0

- name: Ensure root rclone config directory exists
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    mode: '0700'

- name: Deploy root rclone config from vault
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /root/.config/rclone/rclone.conf
    mode: '0600'
    owner: root
    group: root

- name: Ensure nas-01 is mapped to local LAN IP in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^192\.168\.178\.46\s+'
    line: '192.168.178.46  nas-01 nas-01.fritz.box'
    state: present

- name: Ensure kevin rclone config directory exists
  ansible.builtin.file:
    path: /home/kevin/.config/rclone
    state: directory
    mode: '0700'
    owner: kevin
    group: kevin

- name: Deploy kevin rclone config from vault
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /home/kevin/.config/rclone/rclone.conf
    mode: '0600'
    owner: kevin
    group: kevin
